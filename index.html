<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./style/dashboard.css">
    <title>Dashboard</title>


</head>

<body>
    <!-- navbar -->
    <nav>
        <!-- logo and sarchbar -->
        <div class="left-nav">
            <img class="fb-logo" src="../images/logo.webp" alt="">

            <input type="text" placeholder="Search Facebook">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>


        <div class="center-nav">
            <button><i class="fa-solid fa-house"></i></button>
            <button><i class="fa-brands fa-square-youtube"></i></button>
            <button><i class="fa-solid fa-store"></i></button>
            <button><i class="fa-solid fa-users"></i></button>
            <button><i class="fa-solid fa-gamepad"></i></button>
        </div>
        <div class="right-nav">
            <button><i class="fa-solid fa-bars"></i></button>
            <button><i class="fa-brands fa-facebook-messenger"></i></button>
            <button class="notification">
                <p>5</p><i class="fa-solid fa-bell"></i>
            </button>
            <img src="./images/profile.png" alt="">
        </div>
    </nav>
    <div class="hero-section">
        <div class="left-bar">
            <button><img src="./images/profile.png" alt="">
                <p>Talha Ansari</p>
            </button>
            <button><img src="./images/meta-ai.webp" alt="">
                <p>Meta AI</p>
            </button>
            <button><img src="./images/friends.png" alt="">
                <p>Friends</p>
            </button>
            <button><img src="./images/memories.png" alt="">
                <p>Memories</p>
            </button>
            <button><img src="./images/saved.png" alt="">
                <p>Saved</p>
            </button>
            <button><img src="./images/groups.png" alt="">
                <p>Groups</p>
            </button>
            <button><img src="./images/reels.png" alt="">
                <p>Reels</p>
            </button>
            <button><img src="./images/marketplace.png" alt="">
                <p>Marketplace</p>
            </button>
            <button><img src="./images/feeds.jfif" alt="">
                <p>Reels</p>
            </button>
            <button><img src="./images/events.jfif" alt="">
                <p>Events</p>
            </button>
            <button><img src="./images/ads manager.jfif" alt="">
                <p>Ads Manager</p>
            </button>
            <button><img src="./images/birthdays.png" alt="">
                <p>Birthdays</p>
            </button>
            <button><img src="./images/chat-with-us.png" alt="">
                <p>Chat with As</p>
            </button>
            <button><img src="./images/gaming-video.webp" alt="">
                <p>Gaming Video</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Massenger</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Massenger Kids</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Orders and Payments</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Pages</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Play games</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Support</p>
            </button>
            <button><img src="./images/profile.png" alt="">
                <p>Your Ad Activity</p>
            </button>
        </div>
        <!-- feeding area work -->
        <div class="feeding">
            <div class="feeding-head">
                <img src="./images/profile.png" alt="">
                <input type="text" placeholder="Whats on your mind, Talha?">
                <div class="feeding-head-btn">
                    <button class="camera-btn"><i class="fa-solid fa-video"></i></button>
                    <button class="photo-btn"><i class="fa-solid fa-images"></i></button>
                    <button class="emoji-btn"><i class="fa-regular fa-face-grin"></i></button>
                </div>


            </div>
            <div class="story-section">
                <img src="./images/story-1.jpg" alt="">
                <img src="./images/story-2.jfif" alt="">
                <img src="./images/story-3.jfif" alt="">
                <img src="./images/story-4.jfif" alt="">
                <img src="./images/story-5.jfif" alt="">
            </div>
            <div class="post-section">
                <div class="post-head">

                    <div class="img-name">
                        <img src="./images/dp-1.jpg" alt="">
                        <div>
                            <p><a href="">Muhammad Inayat</a></p>
                            <p>7 hours ago .<i class="fa-solid fa-user-group"></i></p>
                        </div>
                    </div>
                    <div class="post-close">
                        <a href=""><i class="fa-solid fa-ellipsis"></i></a>
                        <a href=""><i class="fa-solid fa-xmark"></i></a>
                    </div>
                </div>
                <div class="post">
                    <video src="./video/Periodic Table.mp4" controls autoplay></video>

                </div>
            </div>
        </div>
        <div class="right-bar"></div>

    </div>

</body>

</html>
